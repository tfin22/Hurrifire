<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Scramble!</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <style>
      html, body {
        margin: 0; padding: 0; height: 100%; overflow: hidden;
        background: #000; color: #ccc;
        touch-action: none; user-select: none; -webkit-user-select: none;
        -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
        font-family: "Courier New", monospace;
      }
      #screen {
        position: absolute; image-rendering: pixelated; image-rendering: crisp-edges;
        background: #000; touch-action: none;
      }
      .touch-root { position: fixed; inset: 0; pointer-events: none; }
      .zone { position: absolute; pointer-events: auto; touch-action: none; }
      .touch-root[data-mode="menu"] .zone-right > *,
      .touch-root[data-mode="menu"] .zone-left .stick-base,
      .touch-root[data-mode="menu"] .zone-left .stick-knob { display: none !important; }
      .touch-root[data-mode="menu"] .zone { pointer-events: none; }
      .touch-root[data-mode="menu"] .ctx-box { pointer-events: auto; }
      .touch-root.narrow .zone { opacity: 0.55; }
      .stick-base, .stick-knob { position: absolute; display: none; border-radius: 50%; pointer-events: none; }
      .stick-base { border: 2px solid #887; background: rgba(80, 90, 80, 0.25); box-sizing: border-box; }
      .stick-knob { background: rgba(200, 190, 160, 0.55); border: 2px solid #ddc; box-sizing: border-box; }
      .btn {
        position: relative; box-sizing: border-box; border: 2px solid #887; color: #ddc;
        background: rgba(40, 44, 36, 0.85); font: bold 11px "Courier New", monospace;
        display: flex; align-items: center; justify-content: center; text-align: center;
        border-radius: 4px; touch-action: none; pointer-events: auto;
      }
      .btn.on { background: #a85; color: #000; }
      .btn.lit { border-color: #fa5; color: #fa5; }
      .btn-fire {
        position: absolute; right: 26%; bottom: 6%; width: 52%; aspect-ratio: 1;
        max-width: 120px; border-radius: 50%; border-color: #c22; color: #fdd; font-size: 15px;
        background: rgba(110, 20, 20, 0.8);
      }
      .btn-fire.on { background: #e40; color: #000; }
      .throttle-track {
        position: absolute; right: 4%; top: 8%; bottom: 8%; width: 16%; min-width: 26px;
        border: 2px solid #887; border-radius: 4px; background: rgba(30, 30, 30, 0.6); box-sizing: border-box;
      }
      .throttle-knob {
        position: absolute; left: -4px; right: -4px; height: 14px; margin-bottom: -7px;
        background: #ddc; border-radius: 3px; pointer-events: none;
      }
      .throttle-label { position: absolute; top: -16px; width: 100%; text-align: center; font: bold 10px monospace; color: #998; }
      .small-box {
        position: absolute; left: 4%; right: 24%; top: 4%; display: grid;
        grid-template-columns: 1fr 1fr; gap: 6px;
      }
      .btn-small { height: 34px; font-size: 10px; }
      .ctx-box {
        position: absolute; left: 6%; right: 6%; top: 4%; display: flex; flex-wrap: wrap; gap: 6px;
      }
      .btn-ctx { flex: 1 1 42%; height: 34px; font-size: 10px; border-color: #fa5; }
      #rotate {
        position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
        background: #000; color: #ddc; font: bold 16px monospace; text-align: center; z-index: 10;
      }
      @media (orientation: portrait) and (max-width: 700px) { #rotate { display: flex; } }
    </style>
  </head>
  <body>
    <canvas id="screen" width="320" height="256"></canvas>
    <div id="rotate">Turn your phone sideways<br />to scramble.</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
